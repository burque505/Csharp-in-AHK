; Optional path settings for Csharp-in-AHK.ahk and Csx-in-AHK.ahk.
; Copy this file to Csharp-in-AHK.ini, next to the libraries, and edit it.
; Both libraries find .NET and Roslyn automatically, so you only need this file if that fails or picks the wrong ones.
; Leave a key empty (or delete it) to auto-detect that path.
; The environment variables CSHARP_IN_AHK_DOTNET / CSHARP_IN_AHK_ROSLYN take precedence over this file.

[Paths]
; Folder containing host\fxr and shared\Microsoft.NETCore.App (.NET 8 or later), e.g.
;   C:\Program Files\dotnet
;   C:\Program Files\Microsoft Visual Studio\18\Community\dotnet\net10.0\runtime
DotnetRoot=

; Folder containing csc.exe and the Microsoft.CodeAnalysis*.dll files, e.g.
;   C:\Program Files\Microsoft Visual Studio\18\Community\MSBuild\Current\Bin\Roslyn
RoslynDir=
