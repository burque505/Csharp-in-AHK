; Optional path settings for Csharp-in-AHK.ahk and Csx-in-AHK.ahk.
; Copy this file to Csharp-in-AHK.ini, next to the libraries, and edit it.
; Both libraries find .NET and Roslyn automatically, so you only need this file if that fails or picks the wrong ones.
; Leave a key empty (or delete it) to auto-detect that path.
; The environment variables CSHARP_IN_AHK_DOTNET / CSHARP_IN_AHK_ROSLYN take precedence over this file.

[Paths]
; Folder containing host\fxr and shared\Microsoft.NETCore.App (.NET 8 or later), e.g.
;   C:\Program Files\dotnet
;   C:\Program Files\Microsoft Visual Studio\18\Community\dotnet\net10.0\runtime
DotnetRoot=

; Folder containing csc.exe and the Microsoft.CodeAnalysis*.dll files, e.g.
;   C:\Program Files\Microsoft Visual Studio\18\Community\MSBuild\Current\Bin\Roslyn
;   the tasks\net472 folder of the Microsoft.Net.Compilers.Toolset NuGet package (another version than the default)
; If no Roslyn is found anywhere, Microsoft.Net.Compilers.Toolset 5.9.0 is downloaded from nuget.org on first use into
;   %LOCALAPPDATA%\Csharp-in-AHK\roslyn\5.9.0\tasks\net472
RoslynDir=

; Csharp-in-AHK only (see "Shipping a program" in README.md): a program that carries everything it needs.
; Relative paths are taken from this file's folder (Csx-in-AHK doesn't read relative paths: keep DotnetRoot and
; RoslynDir absolute if it uses this file too).
;   HostDll=lib\host\CSHost-MyApp.dll     the host, built beforehand with CSharpBuildHost
;   PackagesManifest=lib\packages.txt    "compile|path", "runtime|path" and "native|path" lines; #:package resolves from them
;   CacheDir=lib\cache                   the host's runtimeconfig and compiled scripts, instead of %TEMP%
